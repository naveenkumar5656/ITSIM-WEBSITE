<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Transfer</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

/* Header */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;
    background:#0066cc;
    color:white;
    display:flex;
    align-items:center;
    padding:0 25px;
    z-index:9999;
}

.header h2{
    margin:0;
    font-size:28px;
}

/* Sidebar */

.sidebar{
    position:fixed;
    top:65px;
    left:0;
    width:230px;
    height:calc(100vh - 65px);
    background:#1f2937;
}

.sidebar a{
    display:block;
    padding:18px 20px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #374151;
    font-size:16px;
}

.sidebar a:hover{
    background:#0066cc;
}

/* Main */

.main{
    margin-left:230px;
    padding:35px;
}

/* Transfer Card */

.transfer-card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    max-width:900px;
}

.transfer-card h1{
    margin-top:0;
    margin-bottom:30px;
}

/* Form */

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

/* Button */

.transfer-btn{
    margin-top:10px;
    background:#28a745;
    color:white;
    border:none;
    padding:13px 25px;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

.transfer-btn:hover{
    background:#218838;
}

</style>

</head>

<body>

<!-- Header -->

<div class="header">

    <h2>ITSIM - IT Support & Infrastructure Management</h2>

</div>


<!-- Sidebar -->

<div class="sidebar">

    <a href="dashboard.html">🏠 Dashboard</a>

    <a href="categorymaster.html">📂 Category Master</a>

    <a href="itemnamemaster.html">📝 Item Name Master</a>

    <a href="vendormaster.html">🏢 Vendor Master</a>

    <a href="itemmaster.html">📦 Item Master</a>

    <a href="viewitems.html">📋 View Items</a>

    <a href="purchaseentry.html">🛒 Purchase Entry</a>

    <a href="purchasebillregister.html">📄 Purchase / Bill Register</a>

    <a href="transfer.html">🔄 College Transfer</a>

    <a href="login.html">🚪 Logout</a>

</div>


<!-- Main -->

<div class="main">

    <div class="transfer-card">

        <h1>🏫 College Transfer</h1>


        <div class="form-group">

            <label>From College</label>

            <select>
                <option value="">-- Select College --</option>
                <option>KSRCE</option>
                <option>KSRCT</option>
                <option>KSRCAS</option>
                <option>KSR Polytechnic</option>
            </select>

        </div>


        <div class="form-group">

            <label>To College</label>

            <select>
                <option value="">-- Select College --</option>
                <option>KSRCT</option>
                <option>KSRCE</option>
                <option>KSRCAS</option>
                <option>KSR Polytechnic</option>
            </select>

        </div>
        
         <div class="form-group">

          <label>Transfer Date</label>

         <input
         type="date"
         id="transferDate"
    >
          </div>

         <div class="form-group">

         <label>Item Name</label>

         <select id="transferItem">
         <option value="">-- Select Item --</option>
         </select>

         </div>

         <div class="form-group">

            <label>Quantity</label>

            <input
                type="number"
                placeholder="Enter Quantity"
            >

        </div>


        <button
            type="button"
            class="transfer-btn">
            🔄 Transfer Item
        </button>

    </div>

</div>

<script src="script.js"></script>

<script>
    loadTransferItemDropdown();
</script>

</body>
</html>
