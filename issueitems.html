<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Items</title>
</head>

<body>

<div style="background:#0066cc;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;">

ITSIM - IT Support & Infrastructure Management

</div>

<br>

<h1>📤 Issue Items</h1>

<br>

<label><b>Issue To College</b></label><br>
<select>
    <option>KSRCE</option>
    <option>KSRCT</option>
    <option>KSRCAS</option>
    <option>KSR Polytechnic</option>
</select>

<br><br>

<label><b>Department</b></label><br>
<input type="text" placeholder="Enter Department">

<br><br>

<label><b>Issue To</b></label><br>
<input type="text" placeholder="Faculty / Staff Name">

<br><br>

<label><b>Item Name</b></label><br>

<select id="itemName" onchange="changeStock()">

    <option>Select Item</option>

    <option>Mouse</option>

    <option>Keyboard</option>

    <option>Monitor</option>

    <option>Desktop</option>

    <option>Laptop</option>

    <option>Printer</option>

    <option>LAN Cable</option>

    <option>UPS</option>

</select>

<br><br>

<label><b>Available Stock</b></label><br>

<input type="number" id="availableStock" value="100" readonly>

<br><br>

<label><b>Quantity</b></label><br>
<input type="number" placeholder="Enter Quantity">

<br><br>

<label><b>Issue Date</b></label><br>
<input type="date" id="issueDate">

<br><br>

<label><b>Remarks</b></label><br>
<textarea rows="4" cols="40" placeholder="Enter Remarks"></textarea>

<br><br>

<button onclick="saveIssue()"
style="
background:#0066cc;
color:white;
padding:12px 25px;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;">

📤 Issue Item

</button>

<script>

function changeStock(){

    let item = document.getElementById("itemName").value;

    let stock = document.getElementById("availableStock");

    if(item=="Mouse"){

        stock.value=100;

    }

    else if(item=="Keyboard"){

        stock.value=50;

    }

    else if(item=="Monitor"){

        stock.value=25;

    }

    else if(item=="Desktop"){

        stock.value=15;

    }

    else if(item=="Laptop"){

        stock.value=40;

    }

    else if(item=="Printer"){

        stock.value=10;

    }

    else if(item=="LAN Cable"){

        stock.value=500;

    }

    else if(item=="UPS"){

        stock.value=30;

    }

    else{

        stock.value=0;

    }

}

</script>

</body>
</html>
