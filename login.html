<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITSIM Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0F2027,#203A43,#2C5364);
}

.login-box{
    width:420px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:#0066cc;
    font-size:40px;
}

.logo p{
    color:gray;
    margin-top:10px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.remember{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:14px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#007BFF;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:gray;
    font-size:14px;
}

.footer a{
    color:#007BFF;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>ITSIM</h1>
        <p>IT Support & Infrastructure Management</p>
    </div>

    <form onsubmit="return loginUser()">

        <div class="input-box">
            <label>Username</label>
            <input type="text" placeholder="Enter Username" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter Password" required>
        </div>

        <div class="remember">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div class="footer">
        © 2026 ITSIM
    </div>

</div>

<script>

function loginUser(){

    // dashboard1 page-ku redirect
    window.location.href = "dashboard.html";

    return false;
}

</script>

</body>
</html>
