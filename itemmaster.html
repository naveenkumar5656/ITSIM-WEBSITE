<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSIM - Item Master</title>

    <link rel="stylesheet" href="style.css">

    <style>

    body{
        margin:0;
        background:#f4f6f9;
        font-family:Arial,Helvetica,sans-serif;
    }

    .header{
        height:70px;
        background:#0066cc;
        color:white;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:0 30px;
    }

    .sidebar{
        position:fixed;
        top:70px;
        left:0;
        width:240px;
        height:100%;
        background:#1f2937;
    }

    .sidebar a{
        display:block;
        color:white;
        padding:16px;
        text-decoration:none;
        border-bottom:1px solid rgba(255,255,255,.1);
    }

    .sidebar a:hover{
        background:#0066cc;
    }

    .main{
        margin-left:260px;
        padding:30px;
    }

    .title{
        font-size:30px;
        color:#003366;
        margin-bottom:25px;
    }

    .form-box{
        background:white;
        padding:25px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,.15);
    }

    .grid{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:20px;
    }

    .group{
        display:flex;
        flex-direction:column;
    }

    label{
        margin-bottom:8px;
        font-weight:bold;
    }

    input,
    select,
    textarea{

        padding:12px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:15px;

    }

    textarea{
        resize:none;
        height:90px;
    }

    .full{
        grid-column:1/3;
    }

    .buttons{

        margin-top:25px;
        display:flex;
        gap:15px;

    }

    button{

        padding:14px 30px;
        border:none;
        border-radius:6px;
        cursor:pointer;
        color:white;
        font-size:16px;

    }

    .save{
        background:#28a745;
    }

    .reset{
        background:#dc3545;
    }

    </style>

</head>

<body>

<div class="header">

<h2>ITSIM - Item Master</h2>

<h3>Welcome Admin</h3>

</div>

<div class="sidebar">

<a href="dashboard.html">🏠 Dashboard</a>

<a href="itemmaster.html">📦 Item Master</a>

<a href="viewitems.html">📋 View Items</a>

<a href="reports.html">📊 Reports</a>

<a href="login.html">🚪 Logout</a>

</div>

<div class="main">

<h1 class="title">IT Asset Entry Form</h1>

<div class="form-box">

<form id="itemForm">

<hr>

<h2>📦 Inventory Details</h2>

<div class="grid">

<div class="group">

<label>Quantity</label>

<input
type="number"
id="quantity"
placeholder="Enter Quantity">

</div>

<div class="group">

<label>Vendor</label>

<select id="vendor">

</select>

</div>

<div class="group">

<label>Purchase Date</label>

<input
type="date"
id="purchaseDate">

</div>

<div class="group">

<label>Unit Cost (₹)</label>

<input
type="number"
id="cost"
placeholder="Enter Cost">

</div>

<div class="group">

<label>Status</label>

<select id="status">

<option>Available</option>
<option>Issued</option>
<option>Damaged</option>
<option>Repair</option>

</select>

</div>

</div>

<hr><br>

<div class="grid">


<!-- Item Type -->

<div class="group">

<label>Item Type</label>

<select id="itemType">
    <option value="">-- Select Item Type --</option>
    <option value="asset">🖥️ Asset</option>
    <option value="consumable">📦 Consumable</option>
</select>

</div>

<!-- Category -->

<div class="group">

<label>Category</label>

<select id="category">


</select>

</div>

<!-- Quantity -->

<div class="group">

<label>Quantity</label>

<input
type="number"
id="quantity"
placeholder="Enter Quantity"
min="1"
value="1">

</div>

<div class="group">

<label>Item Name</label>

<input
type="text"
id="itemname"
placeholder="Enter Item Name">

</div>

<div class="group">

<label>Brand</label>

<select id="brand">

</select>

</div>

<div class="group">

<label>Model</label>

<input
type="text"
id="model"
placeholder="Model Number">

</div>

<div class="group full">

<label>Specification</label>

<textarea
id="specification"
placeholder="Enter Specification"></textarea>

</div>

< div class="group" id="serialGroup">


<label>Serial Number</label>

<input
type="text"
id="serial">

</div>

<div class="group">

<label>Asset ID</label>

<input
type="text"
id="assetid">

</div>

<div class="group">

<label>College</label>

<select id="college">

</select>

</div>

<div class="group">

<label>Department</label>

<input
type="text"
id="department">

</div>

<hr style="margin:30px 0;">

<div class="buttons">

    <button type="button" onclick="saveItem()" class="save">
        💾 Save Item
    </button>

    <button type="reset" class="reset">
        🔄 Clear
    </button>

    <a href="viewitems.html" class="btn">
        📋 View Items
    </a>

</div>

</div> <!-- grid -->

</form>

</div> <!-- form-box -->

</div> <!-- main -->

<script src="script.js"></script>

</body>
</html>
