<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Service / Repair</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

/* Header */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;
    background:#0066cc;
    color:white;
    display:flex;
    align-items:center;
    padding:0 25px;
    z-index:9999;
}

.header h2{
    margin:0;
    font-size:28px;
}

/* Sidebar */

.sidebar{
    position:fixed;
    top:65px;
    left:0;
    width:230px;
    height:calc(100vh - 65px);
    background:#1f2937;
    z-index:9998;
}

.sidebar a{
    display:block;
    padding:18px 20px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #374151;
    font-size:16px;
}

.sidebar a:hover{
    background:#0066cc;
}

/* Main */

.main{
    margin-left:230px;
    padding:100px 35px 35px;
}

/* Service Card */

.service-card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    max-width:950px;
}

.service-card h1{
    margin-top:0;
    margin-bottom:30px;
}

/* Form */

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

/* Photo */

.photo-box{
    border:2px dashed #bbb;
    padding:20px;
    border-radius:8px;
    background:#fafafa;
}

.photo-box input{
    border:none;
    padding:5px 0;
}

/* Save Button */

.save-btn{
    margin-top:5px;
    background:#28a745;
    color:white;
    border:none;
    padding:13px 25px;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

.save-btn:hover{
    background:#218838;
}

</style>

</head>


<body>


<!-- Header -->

<div class="header">

    <h2>ITSIM - IT Support & Infrastructure Management</h2>

</div>


<!-- Sidebar -->

<div class="sidebar">

    <a href="dashboard.html">🏠 Dashboard</a>

    <a href="categorymaster.html">📂 Category Master</a>

    <a href="itemnamemaster.html">📝 Item Name Master</a>

    <a href="vendormaster.html">🏢 Vendor Master</a>

    <a href="itemmaster.html">📦 Item Master</a>

    <a href="viewitems.html">📋 View Items</a>

    <a href="purchaseentry.html">🛒 Purchase Entry</a>

    <a href="purchasebillregister.html">📄 Purchase / Bill Register</a>

    <a href="transfer.html">🔄 College Transfer</a>

    <a href="issueitems.html">📤 Issue Items</a>

    <a href="service.html">🔧 Service / Repair</a>

    <a href="login.html">🚪 Logout</a>

</div>


<!-- Main -->

<div class="main">

    <div class="service-card">

        <h1>🔧 Service / Repair Entry</h1>


        <!-- Service No -->

        <div class="form-group">

            <label>Service No</label>

            <input
                type="text"
                id="serviceNo"
                value="SRV-0001"
                readonly
            >

        </div>


        <!-- Service Date -->

        <div class="form-group">

            <label>Service Date</label>

            <input
                type="date"
                id="serviceDate"
            >

        </div>


        <!-- College -->

        <div class="form-group">

            <label>College</label>

            <select id="serviceCollege">

                <option value="">-- Select College --</option>

                <option>KSRCE</option>
                <option>KSRCT</option>
                <option>KSRCAS</option>
                <option>KSR Polytechnic</option>

            </select>

        </div>


        <!-- Item Name -->

        <div class="form-group">

            <label>Item Name</label>

            <select id="serviceItem">

                <option value="">-- Select Item --</option>

            </select>

        </div>


        <!-- Vendor -->

        <div class="form-group">

            <label>Vendor</label>

            <select id="serviceVendor">

                <option value="">-- Select Vendor --</option>

            </select>

        </div>


        <!-- Fault -->

        <div class="form-group">

            <label>Fault Description</label>

            <textarea
                id="faultDescription"
                rows="4"
                placeholder="Enter the fault / problem details">
            </textarea>

        </div>


        <!-- Status -->

        <div class="form-group">

            <label>Current Status</label>

            <select id="serviceStatus">

                <option value="">-- Select Status --</option>

                <option>Fault Reported</option>
                <option>Sent for Service</option>
                <option>Under Service</option>
                <option>Returned</option>
                <option>Completed</option>

            </select>

        </div>


        <!-- Before Photo -->

        <div class="form-group">

            <label>Before Service Photo</label>

            <div class="photo-box">

                <input
                    type="file"
                    id="beforePhoto"
                    accept="image/*"
                    capture="environment"                >


            </div>

        </div>
    
        <!-- After Service Photo -->

         <div class="form-group">

        <label>After Service Photo</label>

         <div class="photo-box">

        <input
    type="file"
    id="afterPhoto"
    accept="image/*"
    capture="environment"

          </div>

        </div>

        <!-- Remarks -->

        <div class="form-group">

            <label>Remarks</label>

            <textarea
                id="serviceRemarks"
                rows="4"
                placeholder="Enter additional remarks">
            </textarea>

        </div>


        <!-- Save -->

        <button
            type="button"
            class="save-btn"
            onclick="saveService()">

            💾 Save Service

        </button>

    </div>

</div>


<script>

function loadServiceItemDropdown(){

    let dropdown = document.getElementById("serviceItem");

    if(!dropdown) return;

    let itemNames =
        JSON.parse(localStorage.getItem("itemNames")) || [];

    dropdown.innerHTML =
        '<option value="">-- Select Item --</option>';

    itemNames.forEach(function(item){

        dropdown.innerHTML += `
            <option value="${item.itemName}">
                ${item.itemName}
            </option>
        `;

    });

}

function saveService(){

    alert("Service Entry Saved Successfully");

}

window.addEventListener("load", function(){

    loadServiceItemDropdown();

});

</script>


</body>

</html>
