<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITSIM - Masters</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#0066cc;
    color:white;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.row div{
    flex:1;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

select,input{
    width:100%;
    padding:10px;
    font-size:15px;
}

button{
    margin-top:20px;
    background:#28a745;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#0066cc;
    color:white;
}

</style>

</head>

<body>

<div class="header">
ITSIM ERP - Masters
</div>

<div class="container">

<div class="row">

<div>

<label>Master Type</label>

<select id="masterType">

<option value="category">Category</option>
<option value="brand">Brand</option>
<option value="vendor">Vendor</option>
<option value="college">College</option>
<option value="department">Department</option>
<option value="location">Location</option>

</select>

</div>

<div>

<label>Master Name</label>

<input
type="text"
id="masterName"
placeholder="Enter Name">

</div>

</div>

<button onclick="saveMaster()">💾 Save</button>

<table>

<thead>

<tr>

<th>S.No</th>
<th>Name</th>

</tr>

</thead>

<tbody id="masterTable">

</tbody>

</table>

</div>

<script src="masters.js"></script>

</body>

</html>
