<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITSIM - View Items</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
height:70px;
background:#0066cc;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
}

.sidebar{
position:fixed;
top:70px;
left:0;
width:220px;
height:100%;
background:#1f2937;
}

.sidebar a{
display:block;
padding:16px;
color:white;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.1);
}

.sidebar a:hover{
background:#0066cc;
}

.main{
margin-left:240px;
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.search{
width:300px;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

.addbtn{
background:#0066cc;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:5px;
}

.table-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0066cc;
color:white;
padding:12px;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

tr:nth-child(even){
background:#f9f9f9;
}

.edit{
background:orange;
color:white;
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
}

.delete{
background:red;
color:white;
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>ITSIM - View Items</h2>

<h3>Welcome Admin</h3>

</div>

<div class="sidebar">

<a href="dashboard.html">🏠 Dashboard</a>

<a href="itemmaster.html">📦 Item Master</a>

<a href="viewitems.html">📋 View Items</a>

<a href="reports.html">📊 Reports</a>

<a href="login.html">🚪 Logout</a>

</div>

<div class="main">

<div class="top">

<input
type="text"
id="search"
class="search"
placeholder="Search Item..."
onkeyup="searchItem()">

<a href="itemmaster.html" class="addbtn">
+ Add New Item
</a>

</div>

<div class="table-box">

<table>

<thead>

<tr>

<th>Asset ID</th>
<th>Category</th>
<th>Item Name</th>
<th>Brand</th>
<th>Model</th>
<th>College</th>
<th>Department</th>
<th>Action</th>

</tr>

</thead>

<tbody id="itemTable">
    <tr id="noData">
    <td colspan="8">No Items Found</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>

// Load Items
let items = JSON.parse(localStorage.getItem("items")) || [];

let output = "";

if(items.length > 0){

    document.getElementById("noData").style.display="none";

    items.forEach(function(item,index){

        output += `
        <tr>

            <td>${item.assetid}</td>

            <td>${item.category}</td>

            <td>${item.itemname}</td>

            <td>${item.brand}</td>

            <td>${item.model}</td>

            <td>${item.college}</td>

            <td>${item.department}</td>

            <td>

                <button class="edit" onclick="editItem(${index})">
                    Edit
                </button>

                <button class="delete" onclick="deleteItem(${index})">
                    Delete
                </button>

            </td>

        </tr>
        `;

    });

    document.getElementById("itemTable").innerHTML = output;

}


// Search
function searchItem(){

    let input=document.getElementById("search").value.toUpperCase();

    let table=document.getElementById("itemTable");

    let tr=table.getElementsByTagName("tr");

    for(let i=0;i<tr.length;i++){

        let txt=tr[i].innerText;

        if(txt.toUpperCase().indexOf(input)>-1){

            tr[i].style.display="";

        }else{

            tr[i].style.display="none";

        }

    }

}


// Delete
function deleteItem(index){

    if(confirm("Delete this Item?")){

        items.splice(index,1);

        localStorage.setItem("items",JSON.stringify(items));

        location.reload();

    }

}


// Edit
function editItem(index){

    alert("Edit Feature will be added in next step.");

}

</script>

</body>
</html>
